# Auto-generated by detect-auth.sh — this exact filename is what hyprlock-auth.conf
# symlinks to when a fingerprint reader is detected. Edit this file directly to change
# fingerprint-host behavior; do not edit hyprlock-auth.conf (it's just a symlink).

# https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/#authentication
auth {
   fingerprint:enabled = true
   fingerprint:ready_message = (Scan fingerprint to unlock)
   fingerprint:present_message = Scanning fingerprint...
   fingerprint:retry_delay = 250

   # /etc/pam.d/hyprlock (the default) includes login -> system-local-login, which has
   # `auth sufficient pam_fprintd.so` ahead of the password check. That blocks the password
   # prompt until the SYSTEM fingerprint attempt resolves, on top of hyprlock's own native
   # fingerprint auth above. Point at system-auth instead, which is password-only (pam_unix),
   # so password and native fingerprint are truly independent (either one unlocks instantly).
   pam:module = system-auth
}

# https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/#input-field
input-field {
  size = 500, 50                                                  # size of the input field
  outline_thickness = 2                                           # input field outline thickness
  dots_size = 0.25                                                # size of the password dots
  dots_spacing = 0.15                                             # spacing between password dots
  dots_rounding = -1                                              # rounding of password dots
  outer_color = $inputOuterColor                                  # color of the border
  inner_color = $inputInnerColor                                  # color of the inner box
  font_color = $mainColor                                         # font color
  font_family = $fontFamily                                       # font family
  fade_on_empty = false                                           # fade the input field when empty
  placeholder_text = $FPRINTPROMPT                                # fingerprint status (this host has a reader)
  fail_text = $PAMFAIL$FPRINTFAIL                                 # text rendered when authentication fails (password or fingerprint failure)
  swap_font_color = true                                          # swap font and inner colors on color change events
  position = 0, -125                                              # position of the input field
}
